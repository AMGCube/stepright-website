<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Stepright Internal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #020e1f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,120,255,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,120,255,0.07) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .glow {
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,100,255,0.1) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .corner {
      position: fixed;
      width: 36px; height: 36px;
      border-color: rgba(0,120,255,0.2);
      border-style: solid;
    }
    .corner-tl { top: 20px; left: 20px; border-width: 1px 0 0 1px; }
    .corner-tr { top: 20px; right: 20px; border-width: 1px 1px 0 0; }
    .corner-bl { bottom: 20px; left: 20px; border-width: 0 0 1px 1px; }
    .corner-br { bottom: 20px; right: 20px; border-width: 0 1px 1px 0; }

    .panel {
      position: relative;
      z-index: 2;
      background: rgba(0,14,40,0.82);
      border: 0.5px solid rgba(0,120,255,0.25);
      border-radius: 4px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
      backdrop-filter: blur(8px);
    }

    .panel-badge {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(41,121,255,0.6);
      margin-bottom: 1.4rem;
    }

    .panel-logo {
      font-size: 30px;
      font-weight: 500;
      letter-spacing: -0.5px;
      line-height: 1;
      margin-bottom: 4px;
    }
    .panel-logo span { color: #2979ff; }

    .panel-sub {
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      margin-bottom: 2rem;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,120,255,0.3), transparent);
      margin-bottom: 1.8rem;
    }

    .form-group { margin-bottom: 14px; }

    .form-label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      background: rgba(0,0,0,0.35);
      border: 0.5px solid rgba(0,120,255,0.2);
      border-radius: 3px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      padding: 10px 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input::placeholder { color: rgba(255,255,255,0.18); }
    .form-input:focus { border-color: rgba(41,121,255,0.55); background: rgba(0,0,0,0.45); }

    .submit-btn {
      width: 100%;
      padding: 11px;
      margin-top: 6px;
      background: rgba(41,121,255,0.14);
      border: 0.5px solid rgba(41,121,255,0.45);
      border-radius: 3px;
      color: #60a5fa;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .submit-btn:hover:not(:disabled) {
      background: rgba(41,121,255,0.24);
      border-color: rgba(41,121,255,0.75);
      color: #fff;
    }
    .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .form-msg {
      margin-top: 11px;
      padding: 9px 12px;
      border-radius: 3px;
      font-size: 12px;
      display: none;
    }
    .form-msg.error {
      display: block;
      background: rgba(255,50,50,0.07);
      border: 0.5px solid rgba(255,80,80,0.3);
      color: #f87171;
    }
    .form-msg.success {
      display: block;
      background: rgba(0,200,100,0.07);
      border: 0.5px solid rgba(0,200,100,0.3);
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="panel">
    <div class="panel-badge">Internal Portal</div>
    <div class="panel-logo">Step<span>right</span></div>
    <div class="panel-sub">Order Management System</div>
    <div class="divider"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input id="email" class="form-input" type="email"
          placeholder="you@stepright.com.au" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" class="form-input" type="password"
          placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button class="submit-btn" type="submit" id="submitBtn">Sign In</button>
      <div class="form-msg" id="formMsg"></div>
    </form>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://aslejjaezqswslogzbov.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Q43ZT9JVWjNuHM92pez07g_XKT2P-hW';
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Redirect if already logged in
    const { data: { session } } = await db.auth.getSession();
    if (session) window.location.replace('order.html');

    const form = document.getElementById('loginForm');
    const btn  = document.getElementById('submitBtn');
    const msg  = document.getElementById('formMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        msg.className   = 'form-msg error';
        msg.textContent = 'Please enter your email and password.';
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Signing in…';
      msg.className   = 'form-msg';

      const { error } = await db.auth.signInWithPassword({ email, password });

      if (error) {
        msg.className   = 'form-msg error';
        msg.textContent = error.message;
        btn.disabled    = false;
        btn.textContent = 'Sign In';
      } else {
        msg.className   = 'form-msg success';
        msg.textContent = 'Login successful, redirecting…';
        window.location.replace('order.html');
      }
    });
  </script>
</body>
</html>
