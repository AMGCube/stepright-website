<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Order — Stepright</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #020e1f;
      color: #fff;
      min-height: 100vh;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,120,255,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,120,255,0.07) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Navbar ── */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: rgba(2,14,31,0.96);
      border-bottom: 0.5px solid rgba(0,120,255,0.18);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 14px;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .nav-logo { font-size: 17px; font-weight: 500; letter-spacing: -0.4px; flex-shrink: 0; }
    .nav-logo span { color: #2979ff; }

    .nav-sep { width: 1px; height: 18px; background: rgba(0,120,255,0.18); flex-shrink: 0; }

    .nav-title {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      flex: 1;
    }

    .nav-user {
      font-size: 12px;
      color: rgba(255,255,255,0.38);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-btn {
      background: rgba(0,0,0,0.28);
      border: 0.5px solid rgba(0,120,255,0.18);
      border-radius: 3px;
      color: rgba(255,255,255,0.4);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.18s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }
    .nav-btn:hover { border-color: rgba(0,120,255,0.45); color: rgba(255,255,255,0.75); }

    /* ── Main ── */
    .main {
      position: relative;
      z-index: 2;
      max-width: 860px;
      margin: 0 auto;
      padding: 76px 20px 64px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
      gap: 10px;
    }

    .page-title { font-size: 22px; font-weight: 500; letter-spacing: -0.4px; }

    .order-no-tag {
      font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: #60a5fa;
      background: rgba(0,100,255,0.08);
      border: 0.5px solid rgba(0,120,255,0.28);
      border-radius: 100px;
      padding: 4px 14px;
    }

    /* ── SKU Sections ── */
    .sku-section {
      background: rgba(0,14,40,0.55);
      border: 0.5px solid rgba(0,120,255,0.14);
      border-radius: 4px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 16px;
      cursor: pointer;
      user-select: none;
      border-bottom: 0.5px solid rgba(0,120,255,0.08);
      transition: background 0.15s;
    }
    .section-header:hover { background: rgba(0,120,255,0.04); }

    .section-title {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    .section-meta { display: flex; align-items: center; gap: 10px; }
    .section-count { font-size: 11px; color: rgba(255,255,255,0.18); }
    .section-selected { font-size: 11px; color: #2979ff; display: none; }
    .section-selected.on { display: block; }

    .chevron { font-size: 11px; color: rgba(255,255,255,0.2); transition: transform 0.2s; }
    .sku-section.collapsed .chevron { transform: rotate(-90deg); }
    .sku-section.collapsed .section-body { display: none; }

    /* ── SKU Table ── */
    .sku-table { width: 100%; border-collapse: collapse; }

    .sku-table thead tr { border-bottom: 0.5px solid rgba(0,120,255,0.08); }

    .sku-table th {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.22);
      font-weight: 400;
      text-align: left;
      padding: 8px 16px;
    }

    .sku-table td {
      padding: 7px 16px;
      font-size: 13px;
      border-bottom: 0.5px solid rgba(0,120,255,0.05);
      vertical-align: middle;
    }
    .sku-table tr:last-child td { border-bottom: none; }
    .sku-table tbody tr:hover td { background: rgba(0,120,255,0.03); }

    .cell-code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.42);
      white-space: nowrap;
    }
    .cell-name { color: rgba(255,255,255,0.82); }
    .cell-unit { font-size: 12px; color: rgba(255,255,255,0.3); white-space: nowrap; }

    .qty-input {
      width: 72px;
      background: rgba(0,0,0,0.38);
      border: 0.5px solid rgba(0,120,255,0.14);
      border-radius: 3px;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      padding: 5px 8px;
      outline: none;
      text-align: center;
      transition: border-color 0.18s, background 0.18s;
    }
    .qty-input:focus { border-color: rgba(41,121,255,0.5); }
    .qty-input.has-value {
      border-color: rgba(41,121,255,0.4);
      background: rgba(41,121,255,0.06);
    }

    /* ── Order Notes ── */
    .notes-wrap {
      background: rgba(0,14,40,0.55);
      border: 0.5px solid rgba(0,120,255,0.14);
      border-radius: 4px;
      padding: 14px 16px;
      margin: 14px 0;
    }

    .field-label {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.32);
      margin-bottom: 8px;
    }

    .notes-textarea {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 0.5px solid rgba(0,120,255,0.14);
      border-radius: 3px;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      resize: vertical;
      min-height: 76px;
      line-height: 1.6;
      transition: border-color 0.18s;
    }
    .notes-textarea::placeholder { color: rgba(255,255,255,0.18); }
    .notes-textarea:focus { border-color: rgba(41,121,255,0.4); }

    /* ── Submit ── */
    .submit-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

    .submit-btn {
      padding: 10px 26px;
      background: rgba(41,121,255,0.13);
      border: 0.5px solid rgba(41,121,255,0.45);
      border-radius: 3px;
      color: #60a5fa;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.18s;
      flex-shrink: 0;
    }
    .submit-btn:hover:not(:disabled) {
      background: rgba(41,121,255,0.24);
      border-color: rgba(41,121,255,0.75);
      color: #fff;
    }
    .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .form-msg {
      padding: 9px 13px;
      border-radius: 3px;
      font-size: 13px;
      flex: 1;
      min-width: 0;
      display: none;
    }
    .form-msg.error {
      display: block;
      background: rgba(255,50,50,0.07);
      border: 0.5px solid rgba(255,80,80,0.3);
      color: #f87171;
    }
    .form-msg.success {
      display: block;
      background: rgba(0,200,100,0.07);
      border: 0.5px solid rgba(0,200,100,0.3);
      color: #4ade80;
    }

    /* ── Loading / Empty ── */
    .state-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 16px;
      color: rgba(255,255,255,0.28);
      font-size: 13px;
    }

    .spin-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #2979ff;
      flex-shrink: 0;
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <nav class="navbar">
    <div class="nav-logo">Step<span>right</span></div>
    <div class="nav-sep"></div>
    <div class="nav-title">New Order</div>
    <div class="nav-user" id="navUser"></div>
    <a href="admin.html" class="nav-btn">Admin ›</a>
    <button class="nav-btn" id="logoutBtn">Sign Out</button>
  </nav>

  <main class="main">
    <div class="page-header">
      <div class="page-title">Place Order</div>
      <div class="order-no-tag" id="orderNoTag">—</div>
    </div>

    <div id="skuContainer">
      <div class="state-panel"><div class="spin-dot"></div> Loading products…</div>
    </div>

    <div class="notes-wrap">
      <div class="field-label">Order Notes</div>
      <textarea id="orderNotes" class="notes-textarea"
        placeholder="Special instructions, delivery requirements, etc."></textarea>
    </div>

    <div class="submit-row">
      <button class="submit-btn" id="submitBtn">Submit Order</button>
      <div class="form-msg" id="formMsg"></div>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://aslejjaezqswslogzbov.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Q43ZT9JVWjNuHM92pez07g_XKT2P-hW';
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    /* ── Auth gate ── */
    const { data: { session } } = await db.auth.getSession();
    if (!session) window.location.replace('login.html');

    document.getElementById('navUser').textContent = session.user.email;

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await db.auth.signOut();
      window.location.replace('login.html');
    });

    /* ── Order number: SR-YYYYMMDD-XXXX ── */
    function makeOrderNo() {
      const d    = new Date();
      const date = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
      const rand = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
      return `SR-${date}-${rand}`;
    }
    function pad(n) { return String(n).padStart(2, '0'); }

    let orderNo = makeOrderNo();
    document.getElementById('orderNoTag').textContent = orderNo;

    /* ── HTML escape ── */
    function esc(v) {
      return String(v ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;')
                            .replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    /* ── Load SKUs (active only, grouped by category) ── */
    // skus table: id (bigint), sku_code, name, category, unit, active
    const { data: skus, error: skuErr } = await db
      .from('skus')
      .select('id, sku_code, name, category, unit')
      .eq('active', true)
      .order('category')
      .order('name');

    const container = document.getElementById('skuContainer');

    if (skuErr || !skus?.length) {
      container.innerHTML = `<div class="state-panel">${skuErr ? esc(skuErr.message) : 'No active products found.'}</div>`;
    } else {
      const groups = skus.reduce((acc, s) => {
        (acc[s.category] = acc[s.category] || []).push(s);
        return acc;
      }, {});

      container.innerHTML = '';

      for (const [cat, items] of Object.entries(groups)) {
        const section = document.createElement('div');
        section.className = 'sku-section';

        section.innerHTML = `
          <div class="section-header">
            <span class="section-title">${esc(cat)}</span>
            <div class="section-meta">
              <span class="section-count">${items.length} items</span>
              <span class="section-selected"></span>
              <span class="chevron">▾</span>
            </div>
          </div>
          <div class="section-body">
            <table class="sku-table">
              <thead>
                <tr>
                  <th>SKU Code</th>
                  <th>Product Name</th>
                  <th>Unit</th>
                  <th>Qty</th>
                </tr>
              </thead>
              <tbody>
                ${items.map(s => `
                  <tr>
                    <td class="cell-code">${esc(s.sku_code)}</td>
                    <td class="cell-name">${esc(s.name)}</td>
                    <td class="cell-unit">${esc(s.unit)}</td>
                    <td>
                      <input
                        type="number"
                        class="qty-input"
                        min="0" step="1"
                        placeholder="0"
                        data-sku-code="${esc(s.sku_code)}"
                        data-sku-name="${esc(s.name)}"
                        data-unit="${esc(s.unit)}"
                      />
                    </td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>`;

        const header  = section.querySelector('.section-header');
        const selSpan = section.querySelector('.section-selected');

        header.addEventListener('click', () => section.classList.toggle('collapsed'));

        section.querySelectorAll('.qty-input').forEach(inp => {
          inp.addEventListener('input', () => {
            inp.classList.toggle('has-value', (parseInt(inp.value) || 0) > 0);
            const total = [...section.querySelectorAll('.qty-input')]
              .reduce((s, i) => s + (parseInt(i.value) || 0), 0);
            selSpan.textContent = total > 0 ? `${total} selected` : '';
            selSpan.classList.toggle('on', total > 0);
          });
        });

        container.appendChild(section);
      }
    }

    /* ── Submit ── */
    const submitBtn = document.getElementById('submitBtn');
    const formMsg   = document.getElementById('formMsg');

    submitBtn.addEventListener('click', async () => {
      // Collect items with qty > 0
      // order_items fields: order_id, sku_code, sku_name, unit, quantity
      const items = [];
      document.querySelectorAll('.qty-input').forEach(inp => {
        const qty = parseInt(inp.value) || 0;
        if (qty <= 0) return;
        items.push({
          sku_code: inp.dataset.skuCode,
          sku_name: inp.dataset.skuName,
          unit:     inp.dataset.unit,
          quantity: qty
        });
      });

      if (!items.length) {
        formMsg.className   = 'form-msg error';
        formMsg.textContent = 'Please enter a quantity for at least one product.';
        return;
      }

      const notes = document.getElementById('orderNotes').value.trim() || null;

      submitBtn.disabled    = true;
      submitBtn.textContent = 'Submitting…';
      formMsg.className     = 'form-msg';

      try {
        // Insert order — orders fields: order_no, created_by, status, notes
        const { data: order, error: oErr } = await db
          .from('orders')
          .insert({
            order_no:   orderNo,
            created_by: session.user.id,
            status:     'pending',
            notes
          })
          .select('id')
          .single();

        if (oErr) throw oErr;

        // Insert order_items — fields: order_id, sku_code, sku_name, unit, quantity
        const { error: iErr } = await db
          .from('order_items')
          .insert(items.map(item => ({ order_id: order.id, ...item })));

        if (iErr) throw iErr;

        formMsg.className   = 'form-msg success';
        formMsg.textContent = `Order ${orderNo} submitted successfully!`;
        submitBtn.textContent = 'Submitted ✓';

        // Reset after 3.5s
        setTimeout(() => {
          document.querySelectorAll('.qty-input').forEach(i => {
            i.value = '';
            i.classList.remove('has-value');
            i.dispatchEvent(new Event('input'));
          });
          document.getElementById('orderNotes').value = '';
          orderNo = makeOrderNo();
          document.getElementById('orderNoTag').textContent = orderNo;
          submitBtn.disabled    = false;
          submitBtn.textContent = 'Submit Order';
          formMsg.className     = 'form-msg';
        }, 3500);

      } catch (err) {
        formMsg.className   = 'form-msg error';
        formMsg.textContent = `Submission failed: ${err.message}`;
        submitBtn.disabled    = false;
        submitBtn.textContent = 'Submit Order';
      }
    });
  </script>
</body>
</html>
