<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stepright Flooring | Premium SPC Flooring Australia</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #020e1f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,120,255,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,120,255,0.07) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .glow {
      position: fixed;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,100,255,0.1) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .corner {
      position: fixed;
      width: 40px;
      height: 40px;
      border-color: rgba(0,120,255,0.25);
      border-style: solid;
    }
    .corner-tl { top: 24px; left: 24px; border-width: 1px 0 0 1px; }
    .corner-tr { top: 24px; right: 24px; border-width: 1px 1px 0 0; }
    .corner-bl { bottom: 24px; left: 24px; border-width: 0 0 1px 1px; }
    .corner-br { bottom: 24px; right: 24px; border-width: 0 1px 1px 0; }

    .dot-grid {
      position: fixed;
      bottom: 80px;
      right: 60px;
      display: grid;
      grid-template-columns: repeat(5, 6px);
      gap: 8px;
      opacity: 0.2;
    }
    .dot-grid span {
      width: 2px;
      height: 2px;
      background: #2979ff;
      border-radius: 50%;
      display: block;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    .badge {
      background: rgba(0,100,255,0.12);
      border: 0.5px solid rgba(0,120,255,0.3);
      color: #60a5fa;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 100px;
      margin-bottom: 2rem;
    }

    .logo-main {
      font-size: clamp(48px, 10vw, 80px);
      font-weight: 500;
      letter-spacing: -2px;
      line-height: 1;
      color: #ffffff;
    }
    .logo-main span { color: #2979ff; }

    .logo-sub {
      font-size: 16px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-top: 10px;
    }

    .scan-line {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #2979ff, transparent);
      margin: 2rem auto;
      animation: scan 3s ease-in-out infinite;
    }
    @keyframes scan {
      0%, 100% { opacity: 0.3; width: 100px; }
      50% { opacity: 1; width: 300px; }
    }

    .tagline {
      font-size: 16px;
      color: rgba(255,255,255,0.45);
      max-width: 380px;
      line-height: 1.8;
      margin-bottom: 3rem;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 1.2rem;
      margin-bottom: 2rem;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2979ff;
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); box-shadow: 0 0 0 0 rgba(41,121,255,0.4); }
      50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 0 6px rgba(41,121,255,0); }
    }
    .status-text {
      font-size: 18px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      font-weight: 300;
    }

    /* Contact Form */
    .contact-section {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      padding: 0 2rem 4rem;
    }

    .contact-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 2.5rem;
    }
    .contact-divider::before,
    .contact-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,120,255,0.3));
    }
    .contact-divider::after {
      background: linear-gradient(90deg, rgba(0,120,255,0.3), transparent);
    }
    .contact-divider span {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(0,120,255,0.6);
      white-space: nowrap;
    }

    .contact-panel {
      background: rgba(0,14,40,0.7);
      border: 0.5px solid rgba(0,120,255,0.25);
      border-radius: 4px;
      padding: 2rem;
      backdrop-filter: blur(8px);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .form-group:last-child { margin-bottom: 0; }

    .form-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }
    .form-label .req { color: #2979ff; }

    .form-input,
    .form-textarea {
      background: rgba(0,0,0,0.35);
      border: 0.5px solid rgba(0,120,255,0.2);
      border-radius: 3px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      width: 100%;
    }
    .form-input::placeholder,
    .form-textarea::placeholder { color: rgba(255,255,255,0.2); }
    .form-input:focus,
    .form-textarea:focus {
      border-color: rgba(41,121,255,0.6);
      background: rgba(0,0,0,0.5);
    }

    .form-textarea {
      resize: vertical;
      min-height: 100px;
      line-height: 1.6;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: rgba(41,121,255,0.15);
      border: 0.5px solid rgba(41,121,255,0.5);
      border-radius: 3px;
      color: #60a5fa;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .submit-btn:hover:not(:disabled) {
      background: rgba(41,121,255,0.25);
      border-color: rgba(41,121,255,0.8);
      color: #fff;
    }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .form-msg {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 3px;
      font-size: 13px;
      display: none;
    }
    .form-msg.success {
      display: block;
      background: rgba(0,200,100,0.08);
      border: 0.5px solid rgba(0,200,100,0.3);
      color: #4ade80;
    }
    .form-msg.error {
      display: block;
      background: rgba(255,50,50,0.08);
      border: 0.5px solid rgba(255,50,50,0.3);
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="glow"></div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="dot-grid">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="content">
    <div class="badge">Premium SPC Flooring</div>

    <div class="logo-main">Step<span>right</span></div>
    <div class="logo-sub">Flooring</div>

    <div class="status-bar">
      <div class="status-dot"></div>
      <div class="status-text">Website coming soon</div>
    </div>

    <div class="scan-line"></div>

    <p class="tagline">
      Engineered for Australian homes.<br>Built to last a lifetime.
    </p>


  </div>

  <!-- Contact Form -->
  <section class="contact-section">
    <div class="contact-divider"><span>Get in touch</span></div>

    <div class="contact-panel">
      <form id="contactForm" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="cf-name">Name <span class="req">*</span></label>
            <input id="cf-name" class="form-input" type="text" placeholder="Your name" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="cf-phone">Phone</label>
            <input id="cf-phone" class="form-input" type="tel" placeholder="04xx xxx xxx" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="cf-email">Email</label>
          <input id="cf-email" class="form-input" type="email" placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label class="form-label" for="cf-message">Message <span class="req">*</span></label>
          <textarea id="cf-message" class="form-textarea" placeholder="Tell us about your project…" required></textarea>
        </div>

        <button class="submit-btn" type="submit" id="submitBtn">
          <span id="btnText">Send Message</span>
        </button>

        <div class="form-msg" id="formMsg"></div>
      </form>
    </div>
  </section>

  <script>
    const SUPABASE_URL = 'https://aslejjaezqswslogzbov.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Q43ZT9JVWjNuHM92pez07g_XKT2P-hW';

    document.getElementById('contactForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const name = document.getElementById('cf-name').value.trim();
      const phone = document.getElementById('cf-phone').value.trim();
      const email = document.getElementById('cf-email').value.trim();
      const message = document.getElementById('cf-message').value.trim();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('formMsg');

      if (!name || !message) {
        msg.className = 'form-msg error';
        msg.textContent = '请填写姓名和留言。';
        return;
      }

      btn.disabled = true;
      document.getElementById('btnText').textContent = 'Sending…';
      msg.className = 'form-msg';

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/contacts`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ name, phone: phone || null, email: email || null, message })
        });

        if (res.ok) {
          msg.className = 'form-msg success';
          msg.textContent = '感谢您的留言，我们会尽快与您联系！';
          document.getElementById('contactForm').reset();
        } else {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || `HTTP ${res.status}`);
        }
      } catch (err) {
        msg.className = 'form-msg error';
        msg.textContent = `提交失败，请稍后再试。（${err.message}）`;
      } finally {
        btn.disabled = false;
        document.getElementById('btnText').textContent = 'Send Message';
      }
    });
  </script>

</body>
</html>
